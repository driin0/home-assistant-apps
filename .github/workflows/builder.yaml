name: Builder

env:
  # Any of these changing inside an app directory triggers a rebuild of that app.
  # rootfs covers apps that ship a filesystem overlay; the Python entries cover
  # apps whose source lives in the build context itself — without them a code-only
  # change would silently leave the published image on the previous version.
  # verify.sh and unexposed-flags.txt are here because changing what the checks
  # assert has to re-run them.
  #
  # translations/ is deliberately absent. It is read by the Supervisor from the
  # repository, never copied into the image, so rebuilding on a wording change
  # would republish the same version tag under a new digest and orphan the
  # previous one for nothing. A description edit is checked at the next rebuild.
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs requirements.txt run.sh server.py web.py stats.py tools verify.sh unexposed-flags.txt"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed_apps=()

          # Rebuild every app when the set of changed files cannot be determined,
          # when this workflow itself changed, or on a manual run. An empty list is
          # not the same as "nothing relevant changed": a push that rewrote history
          # leaves the previous commit unrelated to the new one, so the diff cannot
          # be computed and no file is reported at all. Building everything is the
          # safe reading — otherwise the very push that publishes a release would
          # silently skip its build.
          if [[ -z "${CHANGED_FILES}" ]] \
            || [[ "${EVENT_NAME}" == "workflow_dispatch" ]] \
            || [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-app)\.yaml ]]; then
            changed_apps=(${APPS})
          else
            # Compare whole paths rather than searching for a substring.
            # '${app}/${file}' used to be interpolated into a regex matched
            # against the whole list at once, which had two consequences: an app
            # whose name ends with another app's name matched it as well
            # ('iliad-tools/run.sh' contains 'tools/run.sh'), and the dots in
            # names like config.yaml were metacharacters. Neither misfires with
            # the apps in this repository today, and both would be puzzling the
            # day they did.
            #
            # The second arm covers the entries that are directories — rootfs,
            # tools — where what changes is a file underneath them.
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                for changed in ${CHANGED_FILES}; do
                  if [[ "${changed}" == "${app}/${file}" \
                     || "${changed}" == "${app}/${file}/"* ]]; then
                    changed_apps+=("${app}")
                    break 2
                  fi
                done
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
