configuration:
  mcp_port:
    name: MCP port
    description: TCP port the MCP HTTP server listens on. Default is 47821.
  mcp_secret:
    name: MCP secret
    description: >
      Bearer token to protect the MCP endpoint. Required unless Allow no auth is enabled.
      Generate a strong value with: openssl rand -base64 32
  mcp_allow_no_auth:
    name: Allow no auth
    description: >
      Set to true to run without authentication. Only use this on a trusted local network.
      The add-on will refuse to start if this is false and MCP secret is not set.
  remote_prefixes:
    name: Remote instances
    description: >
      Optional. Comma-separated list of other Home Assistant instances whose entities are
      exposed on this one under a shared entity_id prefix, so that tools grouping by
      location report them separately from the local areas. Each item is either a name —
      the prefix then defaults to sensor.<name>_ — or name=prefix for a different
      convention, e.g. annex,workshop=sensor.ws_ . Leave empty if you run a single instance.
  alexa_keywords:
    name: Alexa keywords
    description: >
      Comma-separated substrings that mark a media player as an Amazon Echo, which is then
      announced to through alexa_media instead of the regular TTS service. The defaults match
      how the Alexa Media Player integration names its entities; add your own if a speaker
      group is named after a room or the household. Leave empty to disable the detection.
  default_language:
    name: Spoken language
    description: >
      Optional. Language code used by the TTS and conversation tools when a call does not
      specify one, e.g. it, de, fr. Leave empty to follow the language Home Assistant is
      configured with. Set it when the two differ — instances are often kept in English to
      obtain English entity IDs while the people using them speak another language.
  mcp_enable_user_management:
    name: Enable user management
    description: >
      Off by default. Registers create_user, update_user and delete_user. Almost nobody
      needs a language model creating Home Assistant accounts, and this is the tier where a
      privileged action disguised as a benign one was demonstrated, so the tools are simply
      not offered unless you ask for them. Home Assistant's user registry is WebSocket-only,
      so call_service cannot reach it either way.
  mcp_enable_physical_security:
    name: Enable physical security tools
    description: >
      On by default. Registers lock_control and alarm_control. Controlling locks and alarms
      is a normal reason to run this server, so they stay enabled — a guardrail everyone
      switches off immediately protects nobody. Turn this off if the assistant should not be
      able to unlock a door or disarm an alarm. Note that call_service can still reach those
      services directly; this gate removes the named tools, not the capability.
  mcp_enable_addon_api:
    name: Enable add-on API proxy
    description: >
      Off by default. Registers call_addon_api, a generic HTTP proxy into an add-on's own
      API. Few installations need it, and in the add-on deployment it carries a
      manager-role Supervisor token, so it is not offered unless you ask for it.
  mcp_allowed_hosts:
    name: Allowed hosts
    description: >
      Optional. Comma-separated hostnames or IPs this server may be reached at from a
      browser. Requests carrying an Origin header are checked against this list plus
      localhost, which is what stops DNS rebinding; requests without one — every ordinary
      MCP client — are unaffected. Set this only if you drive the server from a
      browser-based client at a name other than localhost.
